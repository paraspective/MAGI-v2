name: Deploy WebGL 3D Simulator to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Check Pages Status
        if: steps.setup_pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled or not set to 'GitHub Actions' in repository settings."
          echo "To enable: Go to Settings > Pages > Build and deployment > Source -> select 'GitHub Actions'."

      - name: Upload Simulation Web Artifact
        if: steps.setup_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'simulation/web'

      - name: Deploy to GitHub Pages
        if: steps.setup_pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
