name: MAGI Continuous Integration

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  validate-python:
    name: Lint & Validate Python Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Syntax & Critical Lint Check
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 OS/src simulation/python tools/ --count --select=E9,F63,F7,F82 --show-source --statistics

  validate-urdf:
    name: Check Robot Description URDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install check_urdf
        run: |
          sudo apt-get update
          sudo apt-get install -y liburdfdom-tools

      - name: Validate Production URDF
        run: |
          check_urdf hardware/urdf/MAGI_Assembly_URDF_description/urdf/MAGI_Assembly_URDF.urdf
